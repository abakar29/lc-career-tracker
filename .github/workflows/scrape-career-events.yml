name: Sync Career Center events

on:
  # Scheduled sync disabled for now — was causing trouble (committing on every
  # run and triggering constant redeploys). Re-add a `schedule:` trigger here
  # to turn it back on; until then it only runs when triggered manually.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run scrape:events

      - name: Commit updated events if changed
        run: |
          if git diff --quiet -- public/data/career-events.json; then
            echo "No changes to career events."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/career-events.json
          git commit -m "Sync Career Center events"
          git push
